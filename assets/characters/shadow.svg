<?xml version="1.0" encoding="UTF-8"?>
<!--
  Silent bystander sprite. Vector SVG on purpose: a silhouette has no
  faces or fine detail, so it stays sharp at any scale without a
  50-KB rasterised alternative for every expression. Used by the
  "shadow" ActorDefinition; scenes show them behind the speakers as a
  silent third character.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f2b"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <radialGradient id="rim" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0.75" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a4a70" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <!-- head -->
  <ellipse cx="100" cy="60" rx="34" ry="42" fill="url(#body)"/>
  <!-- neck -->
  <rect x="88" y="96" width="24" height="14" fill="url(#body)"/>
  <!-- shoulders + torso -->
  <path d="M 40 130 Q 100 108 160 130 L 156 240 Q 100 234 44 240 Z"
        fill="url(#body)"/>
  <!-- left arm -->
  <path d="M 44 138 Q 30 200 42 262 Q 54 290 60 300 L 72 296 Q 60 250 60 200 Q 58 150 60 140 Z"
        fill="url(#body)"/>
  <!-- right arm -->
  <path d="M 156 138 Q 170 200 158 262 Q 146 290 140 300 L 128 296 Q 140 250 140 200 Q 142 150 140 140 Z"
        fill="url(#body)"/>
  <!-- hips + legs -->
  <path d="M 60 240 Q 100 230 140 240 L 138 360 Q 130 388 120 388 L 108 388 L 106 300 L 94 300 L 92 388 L 80 388 Q 70 388 62 360 Z"
        fill="url(#body)"/>
  <!-- rim light -->
  <ellipse cx="100" cy="200" rx="80" ry="180" fill="url(#rim)" opacity="0.7"/>
</svg>
