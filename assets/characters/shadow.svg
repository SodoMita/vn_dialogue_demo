<?xml version="1.0" encoding="UTF-8"?>
<!--
  Silent bystander silhouette. Slimmer proportions than the placeholder,
  and one bezier path per body limb so it stays a real person shape at
  any scale. Vector on purpose: no per-expression variants, no need for
  a rasterised alternative (see check_assets.sh whitelist).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141824"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="r" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0.72" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a5580" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <g fill="url(#g)">
    <!-- head, slim oval -->
    <ellipse cx="100" cy="46" rx="22" ry="28"/>
    <!-- neck (short trapezium) -->
    <path d="M 92 70 L 108 70 L 112 86 L 88 86 Z"/>
    <!-- torso: narrow shoulders and taper -->
    <path d="M 74 92 Q 100 84 126 92 L 130 176 Q 116 184 100 184 Q 84 184 70 176 Z"/>
    <!-- left arm slightly relaxed -->
    <path d="M 74 96 Q 60 148 66 214 Q 68 224 74 224 L 82 220 Q 78 176 82 128 Q 84 108 82 98 Z"/>
    <!-- right arm hanging -->
    <path d="M 126 96 Q 140 148 134 214 Q 132 224 126 224 L 118 220 Q 122 176 118 128 Q 116 108 118 98 Z"/>
    <!-- hips + skirt taper into two legs -->
    <path d="M 70 176 Q 100 172 130 176 L 128 224 Q 120 236 118 244 L 108 244 L 106 200 L 94 200 L 92 244 L 82 244 Q 80 236 72 224 Z"/>
    <!-- left leg -->
    <path d="M 82 236 Q 82 300 88 366 L 100 372 L 102 320 L 100 244 Q 92 240 82 236 Z"/>
    <!-- right leg -->
    <path d="M 118 236 Q 118 300 112 366 L 100 372 L 98 320 L 100 244 Q 108 240 118 236 Z"/>
    <!-- shoes -->
    <path d="M 82 372 Q 76 380 78 388 L 106 388 L 106 372 Z"/>
    <path d="M 118 372 Q 124 380 122 388 L 94 388 L 94 372 Z"/>
  </g>
  <!-- rim light on the outline -->
  <ellipse cx="100" cy="200" rx="82" ry="188" fill="url(#r)" opacity="0.6"/>
</svg>
