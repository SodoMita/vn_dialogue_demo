; vn_dialogue_demo export presets — owned by the release pipeline (build/* branches).
; Web            -> GitHub Pages + itch.io html5 channel (Compatibility renderer)
; Linux, Windows -> desktop bundles
;
; Web thread_support = true so audio scheduling + BLAS operate off-main-thread.
; That requires SharedArrayBuffer, which requires COOP/COEP. GitHub Pages does
; not set those headers, so web/coi-serviceworker.js installs a service worker
; that fixes it (classic Google coi-serviceworker.js pattern). See
; scripts/pack_web.sh — it copies the shim into the exported build.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="build/*,build/*/*,art_src/*,ai_agent_docs/*,tools/*,docs/*,tests/*,examples/*,web/*,scripts/*,*.md"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script src=\"coi-serviceworker.js\"></script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]

name="Linux"
platform="Linux"
